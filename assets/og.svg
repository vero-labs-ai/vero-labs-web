<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Vero Labs, applied AI studio, Bangalore">
  <defs>
    <radialGradient id="glow" cx="78%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#E9A23B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#E9A23B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0B0E14"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- mono eyebrow -->
  <text x="80" y="150" fill="#8A93A6"
        font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24"
        letter-spacing="4">VERO LABS // APPLIED AI STUDIO // BANGALORE</text>

  <!-- wordmark / headline -->
  <text x="78" y="320" fill="#E8E6E1"
        font-family="'Space Grotesk', system-ui, sans-serif" font-size="92"
        font-weight="600" letter-spacing="-2">Production AI systems,</text>
  <text x="78" y="420" fill="#E8E6E1"
        font-family="'Space Grotesk', system-ui, sans-serif" font-size="92"
        font-weight="600" letter-spacing="-2">built end to end.</text>

  <!-- mono support line -->
  <text x="80" y="520" fill="#E9A23B"
        font-family="'JetBrains Mono', ui-monospace, monospace" font-size="26"
        letter-spacing="1">multi-agent · voice · computer vision · applied ml</text>

  <!-- hairline + live dot -->
  <rect x="80" y="556" width="1040" height="1" fill="#232A38"/>
  <circle cx="1090" cy="150" r="9" fill="#5FD08A"/>
  <text x="980" y="158" fill="#8A93A6"
        font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22"
        letter-spacing="2">live</text>
</svg>
